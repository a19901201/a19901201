name: Generate profile assets

# Single workflow for all scheduled profile generators.
#
# Root cause of the daily 401s (Nov 2026): the upstream trophy tool only
# reads GITHUB_TOKEN1 / GITHUB_TOKEN2, while the old workflows passed
# `secrets.MY_README`. When that secret is missing or expired the tool
# sends a bare `bearer ` header and GitHub returns 401 Bad credentials
# on every run. The fix is to use the automatic GITHUB_TOKEN, which is
# always present, never expires, and needs no secret setup.
#
# Resource policy (user-requested): run ONE generator per day, not all
# three. A single daily cron (18:00 UTC) triggers the workflow, the
# `pick` job computes the UTC day-of-year modulo 3, and only the
# matching generator job runs (0=3D, 1=trophy, 2=snake, repeat).
# Manual dispatch can still run any single generator, or `all` on demand.
#
# To stop a generator entirely, delete its job below.

on:
  schedule:
    # One runner per day. Which generator runs is decided by the
    # `pick` job below using the UTC day-of-year modulo 3.
    - cron: "0 18 * * *" # daily 18:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Which generator to run"
        required: false
        default: all
        type: choice
        options:
          - all
          - profile-3d
          - trophy
          - snake

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  pick:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      pick: ${{ steps.pick.outputs.pick }}
    steps:
      - id: pick
        run: |
          DOY=$(date -u +%j)
          PICK=$(( (10#$DOY) % 3 ))
          case "$PICK" in
            0) TARGET=profile-3d ;;
            1) TARGET=trophy ;;
            2) TARGET=snake ;;
          esac
          echo "UTC day-of-year=$DOY mod3=$PICK -> $TARGET"
          echo "pick=$TARGET" >> "$GITHUB_OUTPUT"

  profile-3d:
    needs: pick
    if: >-
      github.event_name == 'schedule' && needs.pick.outputs.pick == 'profile-3d' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'all' || inputs.target == 'profile-3d')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-3d-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Preflight token check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty"
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | head -c 200
          echo

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): update 3D contribution graph"
            git push
          fi

  trophy:
    needs: pick
    if: >-
      github.event_name == 'schedule' && needs.pick.outputs.pick == 'trophy' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'all' || inputs.target == 'trophy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trophy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ryo-ma/github-profile-trophy
          path: trophy-generator

      - name: Preflight token check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty. Refusing to run render_svg.ts because it would send an empty bearer token."
            exit 1
          fi
          echo "Token present. Verifying GraphQL access..."
          curl -fsS -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ viewer { login } }"}'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy svg locally
        env:
          # render_svg.ts only reads GITHUB_TOKEN1 / GITHUB_TOKEN2.
          # Map the built-in token to BOTH names so the upstream code works
          # with or without its second-token fallback.
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write ./trophy-generator/render_svg.ts a19901201 ./trophy.svg matrix

      - name: Commit trophy svg
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add trophy.svg
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore(trophy): regenerate trophy.svg"
            git push
          fi

  snake:
    needs: pick
    if: >-
      github.event_name == 'schedule' && needs.pick.outputs.pick == 'snake' ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'all' || inputs.target == 'snake')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: snake-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3
        with:
          github_user_name: a19901201
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
