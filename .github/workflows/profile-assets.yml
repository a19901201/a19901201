name: Generate profile assets

# Single workflow for all scheduled profile generators.
# Before this consolidation there were three separate workflows
# (trophy / snake / profile-3d) and they all referenced the same
# personal access token through a secret named MY_README. That secret
# is external to this repo, expires, and when missing or expired it
# produced a bare `bearer ` header and HTTP 401 "Bad credentials"
# on every daily run.
#
# Fix: use the automatic GITHUB_TOKEN. It is always present, never
# expires, needs no secret setup, and has enough quota for these
# three user-scoped reads (contributions, repositories, followers).
# Trade-off: it only reads the repo owner, which is exactly what
# these three generators do.
#
# Schedules are staggered so heavy jobs do not run at the same time,
# and a single concurrency group per job prevents overlapping runs.
#
# To stop the daily failure mails without touching code, disable a
# job in the Actions tab or delete its file in .github/workflows.

on:
  schedule:
    - cron: "0 17 * * *" # profile-3d, daily 17:00 UTC
    - cron: "0 18 * * *" # trophy, daily 18:00 UTC
    - cron: "0 19 * * *" # snake, daily 19:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Which generator to run"
        required: false
        default: all
        type: choice
        options:
          - all
          - profile-3d
          - trophy
          - snake

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  profile-3d:
    if: >-
      github.event_name == 'schedule' ||
      inputs.target == 'all' || inputs.target == 'profile-3d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-3d-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Preflight token check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty"
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit | head -c 200
          echo

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): update 3D contribution graph"
            git push
          fi

  trophy:
    if: >-
      github.event_name == 'schedule' ||
      inputs.target == 'all' || inputs.target == 'trophy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trophy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ryo-ma/github-profile-trophy
          path: trophy-generator

      - name: Preflight token check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty. Refusing to run render_svg.ts because it would send an empty bearer token."
            exit 1
          fi
          echo "Token present. Verifying GraphQL access..."
          curl -fsS -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ viewer { login } }"}'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy svg locally
        env:
          # render_svg.ts only reads GITHUB_TOKEN1 / GITHUB_TOKEN2.
          # Map the built-in token to BOTH names so the upstream code works
          # with or without its second-token fallback.
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write ./trophy-generator/render_svg.ts a19901201 ./trophy.svg matrix

      - name: Commit trophy svg
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add trophy.svg
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore(trophy): regenerate trophy.svg"
            git push
          fi

  snake:
    if: >-
      github.event_name == 'schedule' ||
      inputs.target == 'all' || inputs.target == 'snake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: snake-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3
        with:
          github_user_name: a19901201
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
